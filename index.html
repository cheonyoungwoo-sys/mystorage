<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자기소개</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6">

    <main class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-xl border border-slate-100 dark:border-slate-700/60 p-8 text-center space-y-6 transition-all">
        
        <div class="relative inline-block">
            <img 
                src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=300" 
                onerror="this.onerror=null; this.src='https://placehold.co/150x150/e2e8f0/475569?text=Profile';"
                alt="프로필 사진" 
                class="w-32 h-32 rounded-full object-cover mx-auto ring-4 ring-indigo-50 dark:ring-slate-700 shadow-md"
            >
        </div>

        <div class="space-y-2">
            <!-- 2. 이름 -->
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                아부리반다
            </h1>
            <!-- 3. 한 줄 소개 -->
            <p class="text-indigo-600 dark:text-indigo-400 font-medium text-sm sm:text-base">
                놀자또놀자
            </p>
        </div>

        <!-- 4. 3~4줄 짧은 자기소개 -->
        <div class="pt-2 border-t border-slate-100 dark:border-slate-700/60">
            <p class="text-slate-600 dark:text-slate-300 text-sm sm:text-base leading-relaxed text-justify sm:text-center">
                새로운 기술을 배우고 문제를 해결하는 과정에서 큰 즐거움을 느낍니다.<br class="hidden sm:inline">
                사용자의 관점에서 필요한 가치가 무엇인지 항상 고민하며 개발합니다.<br class="hidden sm:inline">
                함께 소통하고 협업하여 더 좋은 결과를 만들어내는 것을 좋아합니다다다다.
            </p>
        </div>

    </main>

</body>
</html>
